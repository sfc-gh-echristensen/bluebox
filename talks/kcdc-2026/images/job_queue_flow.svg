<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#336791"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" rx="12" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">SKIP LOCKED Job Queue Flow</text>

  <!-- PostgreSQL container -->
  <rect x="40" y="55" width="720" height="340" rx="10" fill="none" stroke="#336791" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="60" y="78" font-size="12" fill="#336791" font-weight="bold">PostgreSQL</text>

  <!-- bluebox.rental table -->
  <rect x="80" y="95" width="280" height="130" rx="8" fill="#fff" stroke="#336791" stroke-width="2"/>
  <rect x="80" y="95" width="280" height="30" rx="8" fill="#336791"/>
  <rect x="80" y="117" width="280" height="8" fill="#336791"/>
  <text x="220" y="116" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">bluebox.rental</text>
  <text x="100" y="148" fill="#555" font-size="12">rental_id</text>
  <text x="230" y="148" fill="#555" font-size="12">rental_period</text>
  <line x1="210" y1="130" x2="210" y2="225" stroke="#ddd" stroke-width="1"/>
  <text x="100" y="170" fill="#1a1a2e" font-size="13" font-weight="bold">101</text>
  <text x="230" y="170" fill="#c0392b" font-size="13" font-weight="bold">7+ days overdue</text>
  <text x="100" y="192" fill="#1a1a2e" font-size="13" font-weight="bold">102</text>
  <text x="230" y="192" fill="#c0392b" font-size="13" font-weight="bold">7+ days overdue</text>
  <text x="100" y="214" fill="#1a1a2e" font-size="13" font-weight="bold">103</text>
  <text x="230" y="214" fill="#27ae60" font-size="13" font-weight="bold">current</text>

  <!-- Arrow from rental to job_queue -->
  <line x1="360" y1="160" x2="430" y2="160" stroke="#336791" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="365" y="130" width="60" height="22" rx="4" fill="#fff3cd"/>
  <text x="395" y="146" text-anchor="middle" fill="#856404" font-size="12" font-weight="bold">INSERT</text>

  <!-- bluebox.job_queue table -->
  <rect x="440" y="95" width="290" height="165" rx="8" fill="#fff" stroke="#336791" stroke-width="2"/>
  <rect x="440" y="95" width="290" height="30" rx="8" fill="#336791"/>
  <rect x="440" y="117" width="290" height="8" fill="#336791"/>
  <text x="585" y="116" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">bluebox.job_queue</text>
  <text x="460" y="148" fill="#555" font-size="12">job_id</text>
  <text x="540" y="148" fill="#555" font-size="12">status</text>
  <text x="650" y="148" fill="#555" font-size="12">payload</text>
  <line x1="525" y1="130" x2="525" y2="260" stroke="#ddd" stroke-width="1"/>
  <line x1="635" y1="130" x2="635" y2="260" stroke="#ddd" stroke-width="1"/>

  <!-- Job rows -->
  <text x="460" y="170" fill="#1a1a2e" font-size="13" font-weight="bold">1</text>
  <rect x="534" y="157" width="70" height="18" rx="4" fill="#d4edda"/>
  <text x="540" y="170" fill="#155724" font-size="12" font-weight="bold">pending</text>
  <text x="650" y="170" fill="#555" font-size="12">{101}</text>

  <text x="460" y="192" fill="#1a1a2e" font-size="13" font-weight="bold">2</text>
  <rect x="534" y="179" width="70" height="18" rx="4" fill="#d4edda"/>
  <text x="540" y="192" fill="#155724" font-size="12" font-weight="bold">pending</text>
  <text x="650" y="192" fill="#555" font-size="12">{102}</text>

  <text x="460" y="214" fill="#1a1a2e" font-size="13" font-weight="bold">3</text>
  <rect x="534" y="201" width="86" height="18" rx="4" fill="#fff3cd"/>
  <text x="540" y="214" fill="#856404" font-size="12" font-weight="bold">processing</text>
  <text x="650" y="214" fill="#555" font-size="12">{99}</text>

  <text x="460" y="248" fill="#1a1a2e" font-size="13" font-weight="bold">4</text>
  <rect x="534" y="235" width="86" height="18" rx="4" fill="#cce5ff"/>
  <text x="540" y="248" fill="#004085" font-size="12" font-weight="bold">completed</text>
  <text x="650" y="248" fill="#555" font-size="12">{98}</text>

  <!-- Lock icon on row 3 -->
  <text x="720" y="216" font-size="16">🔒</text>

  <!-- Step labels on left -->
  <rect x="60" y="290" width="220" height="90" rx="8" fill="#e8f4f8" stroke="#336791" stroke-width="1.5"/>
  <text x="170" y="315" text-anchor="middle" fill="#336791" font-weight="bold" font-size="13">The key guarantee:</text>
  <text x="170" y="335" text-anchor="middle" fill="#1a1a2e" font-size="12">Jobs + rental data in the</text>
  <text x="170" y="355" text-anchor="middle" fill="#1a1a2e" font-size="12">SAME transaction. No sync.</text>
  <text x="170" y="375" text-anchor="middle" fill="#1a1a2e" font-size="12">No eventual consistency.</text>

  <!-- Arrow down from job_queue to workers -->
  <line x1="585" y1="270" x2="585" y2="410" stroke="#336791" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SKIP LOCKED label -->
  <rect x="478" y="320" width="100" height="50" rx="6" fill="#336791"/>
  <text x="528" y="341" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">FOR UPDATE</text>
  <text x="528" y="358" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">SKIP LOCKED</text>

  <!-- Mark done arrow -->
  <line x1="680" y1="270" x2="680" y2="410" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <rect x="650" y="330" width="65" height="40" rx="6" fill="#27ae60"/>
  <text x="682" y="346" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">mark</text>
  <text x="682" y="362" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">done ✓</text>

  <!-- Workers box -->
  <rect x="440" y="420" width="310" height="170" rx="10" fill="#fff" stroke="#e67e22" stroke-width="2"/>
  <rect x="440" y="420" width="310" height="30" rx="10" fill="#e67e22"/>
  <rect x="440" y="442" width="310" height="8" fill="#e67e22"/>
  <text x="595" y="442" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">Workers</text>

  <!-- Worker rows -->
  <rect x="460" y="460" width="270" height="32" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="1"/>
  <text x="470" y="481" fill="#1a1a2e" font-size="13" font-weight="bold">Worker A</text>
  <text x="590" y="481" fill="#e67e22" font-size="12">grabs job 3</text>

  <rect x="460" y="500" width="270" height="32" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="1"/>
  <text x="470" y="521" fill="#1a1a2e" font-size="13" font-weight="bold">Worker B</text>
  <text x="590" y="521" fill="#e67e22" font-size="12">skips 3 → grabs 1</text>

  <rect x="460" y="540" width="270" height="32" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="1"/>
  <text x="470" y="561" fill="#1a1a2e" font-size="13" font-weight="bold">Worker C</text>
  <text x="590" y="561" fill="#e67e22" font-size="12">skips 3,1 → grabs 2</text>

  <!-- Bottom note -->
  <text x="400" y="608" text-anchor="middle" fill="#888" font-size="12" font-style="italic">No Redis. No RabbitMQ. Just a Postgres table + SKIP LOCKED.</text>
</svg>